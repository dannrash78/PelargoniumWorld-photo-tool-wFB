<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PelargoniumWorld Photo Tool wFB</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#202124}
#tool{width:100%;height:82vh;min-height:620px;border:0;display:block;background:#fff}
#fb-panel{max-width:1080px;margin:0 auto;padding:18px 18px 28px;background:#fff;border-top:1px solid #ddd}
#fb-panel h2{margin:0 0 8px;font-size:20px}
#fb-panel p{margin:0 0 12px;color:#666;font-size:14px}
#fb-post{width:100%;min-height:120px;resize:vertical;padding:12px;border:1px solid #bbb;border-radius:8px;font:16px/1.45 Arial,sans-serif}
#fb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
#fb-count{font-size:13px;color:#666;margin-right:auto}
button{border:0;border-radius:7px;padding:10px 15px;font-weight:600;cursor:pointer}
#copy{background:#eee;color:#222}
#facebook{background:#1877f2;color:#fff}
#status{width:100%;font-size:13px;color:#555;min-height:18px}
</style>
</head>
<body>
<iframe id="tool" src="app.html" title="PelargoniumWorld Photo Tool wFB"></iframe>
<section id="fb-panel" aria-label="Facebook post">
<h2>Facebook публикация</h2>
<p>Въведи текста за публикацията. Можеш да използваш емотиконки — максимум 500 символа.</p>
<textarea id="fb-post" maxlength="500" placeholder="Напиши текста за Facebook публикацията..."></textarea>
<div id="fb-row">
<span id="fb-count">0 / 500</span>
<button id="copy" type="button">Копирай текста</button>
<button id="facebook" type="button">Отвори Facebook</button>
<div id="status" role="status"></div>
</div>
</section>
<script>
const post=document.getElementById('fb-post');
const count=document.getElementById('fb-count');
const status=document.getElementById('status');
const saved=localStorage.getItem('pwfb-post-text');
if(saved) post.value=saved;
function update(){
  count.textContent=post.value.length+' / 500';
  localStorage.setItem('pwfb-post-text',post.value);
}
post.addEventListener('input',update);
update();
document.getElementById('copy').addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText(post.value);
    status.textContent='Текстът е копиран. Можеш да го поставиш във Facebook.';
  }catch(e){
    post.focus();post.select();
    status.textContent='Маркирах текста — натисни Ctrl+C, за да го копираш.';
  }
});
document.getElementById('facebook').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(post.value);}catch(e){}
  window.open('https://www.facebook.com/', '_blank', 'noopener,noreferrer');
  status.textContent='Facebook е отворен. Текстът е копиран — постави го в публикацията.';
});
</script>
</body>
</html>
